<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Syntra · compile image target</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 20px;color:#222}
  img{max-width:240px;border:1px solid #ddd;display:block;margin:12px 0}
  button{font:inherit;padding:10px 18px;border-radius:8px;border:0;background:#c9871a;color:#fff;cursor:pointer}
  #log{margin-top:14px;font-size:14px;color:#555;white-space:pre-line}
</style>
</head><body>
<h2>Compile the drawing into a tracking file</h2>
<p>Takes <code>assets/target.png</code> (the drawing exactly as printed on the ticket) and makes <code>assets/targets.mind</code>.
Run this again whenever you replace <code>target.png</code>.</p>
<img id="img" src="assets/target.png" alt="target">
<button id="run">Compile</button>
<div id="log"></div>
<script type="module">
import { Compiler } from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js";
const log = m => document.getElementById('log').textContent = m;
async function compile(){
  log('Starting…');
  const img = document.getElementById('img');
  if (!img.complete) await new Promise(r => img.onload = r);
  const compiler = new Compiler();
  let src = img; const px = +new URLSearchParams(location.search).get('size');
  if (px) { const c = document.createElement('canvas'); c.width = px; c.height = Math.round(px * img.naturalHeight / img.naturalWidth); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); src = c; }
  await compiler.compileImageTargets([src], p => log('Compiling… ' + Math.round(p) + '%'));
  const buf = await compiler.exportData();
  const blob = new Blob([buf]);
  // if the local helper server (serve.py) is running, save straight into assets/
  try { const r = await fetch('/save?name=targets.mind', { method: 'POST', body: blob }); if (r.ok) { log('Done. Saved assets/targets.mind (' + Math.round(blob.size/1024) + ' KB).'); window.__done = true; return; } } catch (e) {}
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'targets.mind'; a.click();
  log('Done. Move the downloaded targets.mind into the assets folder.'); window.__done = true;
}
const run = () => compile().catch(e => { log('Error: ' + (e && e.message || e)); window.__err = String(e && e.stack || e); });
document.getElementById('run').onclick = run;
if (new URLSearchParams(location.search).has('auto')) run();
</script></body></html>
